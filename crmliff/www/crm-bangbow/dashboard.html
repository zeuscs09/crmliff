<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Bangbow Sales Kit</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Shared Navbar -->
    <script src="shared/navbar.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .period-selector {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .period-selector label {
            font-weight: 600;
            color: #555;
        }
        
        .period-selector select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
        }
        
        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            margin-bottom: 15px;
        }
        
        .stat-card.visits .stat-icon {
            background: linear-gradient(45deg, #4CAF50, #2E7D32);
        }
        
        .stat-card.stores .stat-icon {
            background: linear-gradient(45deg, #FF9800, #E65100);
        }
        
        .stat-card.agents .stat-icon {
            background: linear-gradient(45deg, #2196F3, #0D47A1);
        }
        
        .stat-card.recent .stat-icon {
            background: linear-gradient(45deg, #9C27B0, #4A148C);
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        
        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        .agents-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .agents-list {
            list-style: none;
        }
        
        .agent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .agent-item:last-child {
            border-bottom: none;
        }
        
        .agent-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .agent-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }
        
        .agent-name {
            font-weight: 500;
            color: #333;
        }
        
        .agent-code {
            font-size: 12px;
            color: #666;
        }
        
        .visit-count {
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            display: none;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .period-selector {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="period-selector">
            <label for="period-select">แสดงข้อมูลย้อนหลัง:</label>
            <select id="period-select" onchange="loadDashboard()">
                <option value="7">7 วันที่ผ่านมา</option>
                <option value="30" selected>30 วันที่ผ่านมา</option>
                <option value="90">90 วันที่ผ่านมา</option>
                <option value="365">1 ปีที่ผ่านมา</option>
            </select>
            <span id="date-range" class="text-muted"></span>
        </div>
        
        <div class="error-message" id="error-message"></div>
        
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <div>กำลังโหลดข้อมูล...</div>
        </div>
        
        <div id="dashboard-content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card visits">
                    <div class="stat-icon">
                        <i class="fas fa-store"></i>
                    </div>
                    <div class="stat-number" id="total-visits">0</div>
                    <div class="stat-label">การเยี่ยมร้านทั้งหมด</div>
                </div>
                
                <div class="stat-card recent">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="stat-number" id="recent-visits">0</div>
                    <div class="stat-label">การเยี่ยมร้านล่าสุด</div>
                </div>
                
                <div class="stat-card stores">
                    <div class="stat-icon">
                        <i class="fas fa-building"></i>
                    </div>
                    <div class="stat-number" id="total-stores">0</div>
                    <div class="stat-label">ร้านค้าทั้งหมด</div>
                </div>
                
                <div class="stat-card agents">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-number" id="total-agents">0</div>
                    <div class="stat-label">Sale Agent ที่ใช้งาน</div>
                </div>
            </div>
            
            <div class="charts-section">
                <div class="chart-card">
                    <div class="chart-title">
                        <i class="fas fa-chart-area"></i>
                        การเยี่ยมร้านรายวัน
                    </div>
                    <div class="chart-container">
                        <canvas id="daily-visits-chart"></canvas>
                    </div>
                </div>
                
                <div class="chart-card">
                    <div class="chart-title">
                        <i class="fas fa-chart-pie"></i>
                        ประเภทการเยี่ยมร้าน
                    </div>
                    <div class="chart-container">
                        <canvas id="visit-types-chart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="agents-section">
                <div class="chart-title">
                    <i class="fas fa-trophy"></i>
                    Sale Agent ที่เยี่ยมร้านมากที่สุด
                </div>
                <ul class="agents-list" id="top-agents-list">
                    <!-- จะถูกเติมด้วย JavaScript -->
                </ul>
            </div>
        </div>
    </div>



    <!-- Dashboard JavaScript -->
    <script>
        let dailyChart, typesChart;
        
        async function loadDashboard() {
            const days = document.getElementById('period-select').value;
            
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch(`/api/method/crmliff.crmliff.doctype.cliff_customer_store_visit.cliff_customer_store_visit.get_dashboard_stats?days=${days}`, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch dashboard data');
                }
                
                const data = await response.json();
                const stats = data.message;
                
                // Update stats cards
                document.getElementById('total-visits').textContent = stats.total_visits.toLocaleString('th-TH');
                document.getElementById('recent-visits').textContent = stats.recent_visits.toLocaleString('th-TH');
                document.getElementById('total-stores').textContent = stats.total_stores.toLocaleString('th-TH');
                document.getElementById('total-agents').textContent = stats.total_agents.toLocaleString('th-TH');
                
                // Update date range
                const startDate = new Date(stats.date_range.start_date).toLocaleDateString('th-TH');
                const endDate = new Date(stats.date_range.end_date).toLocaleDateString('th-TH');
                document.getElementById('date-range').textContent = `(${startDate} - ${endDate})`;
                
                // Update charts
                updateDailyVisitsChart(stats.daily_visits);
                updateVisitTypesChart(stats.visit_types);
                
                // Update top agents
                updateTopAgents(stats.top_agents);
                
                document.getElementById('dashboard-content').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError('ไม่สามารถโหลดข้อมูล Dashboard ได้');
            } finally {
                showLoading(false);
            }
        }
        
        function updateDailyVisitsChart(dailyData) {
            const ctx = document.getElementById('daily-visits-chart').getContext('2d');
            
            if (dailyChart) {
                dailyChart.destroy();
            }
            
            const labels = dailyData.map(item => {
                const date = new Date(item.date);
                return date.toLocaleDateString('th-TH', { month: 'short', day: 'numeric' });
            });
            
            const data = dailyData.map(item => item.count);
            
            dailyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'การเยี่ยมร้าน',
                        data: data,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }
        
        function updateVisitTypesChart(typesData) {
            const ctx = document.getElementById('visit-types-chart').getContext('2d');
            
            if (typesChart) {
                typesChart.destroy();
            }
            
            const labels = typesData.map(item => item.visit_type === 'New Store' ? 'ร้านใหม่' : 'เช็คอิน');
            const data = typesData.map(item => item.count);
            const colors = ['#4CAF50', '#2196F3'];
            
            typesChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderColor: colors,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }
        
        function updateTopAgents(agentsData) {
            const agentsList = document.getElementById('top-agents-list');
            agentsList.innerHTML = '';
            
            if (agentsData.length === 0) {
                agentsList.innerHTML = '<li class="agent-item"><span>ไม่มีข้อมูลในช่วงเวลานี้</span></li>';
                return;
            }
            
            agentsData.forEach((agent, index) => {
                const agentItem = document.createElement('li');
                agentItem.className = 'agent-item';
                
                const initials = agent.agent_name ? agent.agent_name.substring(0, 2).toUpperCase() : 'NA';
                
                agentItem.innerHTML = `
                    <div class="agent-info">
                        <div class="agent-avatar">${initials}</div>
                        <div>
                            <div class="agent-name">${agent.agent_name || 'ไม่ระบุชื่อ'}</div>
                            <div class="agent-code">${agent.agent_code || agent.sale_agent}</div>
                        </div>
                    </div>
                    <div class="visit-count">${agent.visit_count} ครั้ง</div>
                `;
                
                agentsList.appendChild(agentItem);
            });
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }
        
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            initBangbowNavbar({
                currentPage: 'dashboard',
                title: 'Dashboard',
                subtitle: 'ภาพรวมการเยี่ยมร้านค้า',
                icon: 'fas fa-chart-line'
            });
            
            loadDashboard();
        });
    </script>
</body>
</html>
